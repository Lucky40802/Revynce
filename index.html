* { margin:0; padding:0; box-sizing:border-box; }
body {

  font-size:15px; line-height:1.65; overflow-x:hidden; min-height:100vh;
}
body::before {
  content:''; position:fixed; inset:0;

}

/* Orbs */
.orb { position:fixed; border-radius:50%; filter:blur(140px); pointer-events:none; z-index:0; }
.orb-1 { width:700px; height:700px; background:radial-gradient(circle,rgba(0,240,212,0.07),transparent 70%); top:-300px; left:-200px; }
.orb-2 { width:500px; height:500px; background:radial-gradient(circle,rgba(124,58,237,0.06),transparent 70%); bottom:-100px; right:-150px; }

/* General */
.page { display:none; }
.page.active { display:block; }
#page-auth.active { display:flex; align-items:center; justify-content:center; min-height:100vh; }

.logo { font-family:var(--font-d); font-size:1.5rem; font-weight:800; color:var(--cyan); text-shadow:0 0 20px var(--cyan-glow); }
.btn-primary {
  background:var(--cyan); color:#05070f; border:none; padding:12px 24px;
  border-radius:12px; font-weight:700; cursor:pointer; transition:all .2s;
  box-shadow:0 0 20px var(--cyan-glow);
}
.btn-primary:hover { transform:translateY(-2px); box-shadow:0 0 30px var(--cyan-glow); }

.card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); }
.card-pad { padding:24px; }

/* Sidebar & Topbar */
.sidebar { width:var(--sidebar); background:var(--bg-card); border-right:1px solid var(--border); position:fixed; height:100vh; overflow-y:auto; z-index:50; }
.app-main { margin-left:var(--sidebar); min-height:100vh; }
.topbar { position:sticky; top:0; z-index:40; background:rgba(5,7,15,0.95); backdrop-filter:blur(16px); border-bottom:1px solid var(--border); }

  userProfile.xp += amount;

};

function showToast(msg, type='info') {
  const toast = document.createElement('div');
  toast.style.cssText = `position:fixed; bottom:20px; right:20px; padding:14px 20px; border-radius:12px; background:${type==='success'?'#22c55e':'var(--cyan)'}; color:#000; font-weight:700; box-shadow:0 0 20px rgba(0,240,212,0.4); z-index:9999;`;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}
