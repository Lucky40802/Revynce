<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070f"/>
      <stop offset="100%" stop-color="#0a0d18"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top cyan bar -->
  <rect width="1200" height="4" fill="#00f0d4"/>

  <!-- Logo mark -->
  <rect x="80" y="220" width="64" height="64" rx="16" fill="#0d1120" stroke="#00f0d4" stroke-width="1.5"/>
  <text x="112" y="264" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="36" fill="#00f0d4">R</text>

  <!-- Wordmark -->
  <text x="162" y="265" font-family="system-ui,sans-serif" font-weight="800" font-size="48" fill="#00f0d4" letter-spacing="-1">Revynce</text>

  <!-- Tagline -->
  <text x="80" y="325" font-family="system-ui,sans-serif" font-size="22" fill="#5a6a8a">AI-Powered Education Platform</text>

  <!-- Description -->
  <text x="80" y="390" font-family="system-ui,sans-serif" font-size="18" fill="#e8eaf0">Upload a PDF — get notes, flashcards, quizzes and a study plan</text>
  <text x="80" y="418" font-family="system-ui,sans-serif" font-size="18" fill="#e8eaf0">in seconds. Replaces Quizlet, Education Perfect, Sentral &amp; Google Classroom.</text>

  <!-- Pills -->
  <rect x="80" y="460" width="100" height="32" rx="16" fill="#0d1120" stroke="#00f0d4" stroke-opacity="0.4"/>
  <text x="130" y="481" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#00f0d4">Free Plan</text>

  <rect x="196" y="460" width="100" height="32" rx="16" fill="#0d1120" stroke="#00f0d4" stroke-opacity="0.4"/>
  <text x="246" y="481" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#00f0d4">AI Powered</text>

  <rect x="312" y="460" width="120" height="32" rx="16" fill="#0d1120" stroke="#00f0d4" stroke-opacity="0.4"/>
  <text x="372" y="481" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#00f0d4">4 Apps Replaced</text>

  <!-- URL -->
  <text x="1120" y="590" text-anchor="end" font-family="system-ui,sans-serif" font-size="14" fill="#5a6a8a">lucky40802.github.io/Revynce</text>
</svg>
