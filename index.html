<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-solid-rounded/css/uicons-solid-rounded.css">

<style>
/* ═══════════════════════════════════════
   ENHANCED CSS - More Premium & Visually Appealing
═══════════════════════════════════════ */
:root {
  --cyan: #00f0d4;
  --cyan-dim: rgba(0, 240, 212, 0.12);
  --cyan-glow: rgba(0, 240, 212, 0.5);
  --violet: #a855f7;
  --violet-dim: rgba(168, 85, 247, 0.15);
  --amber: #fbbf24;
  --rose: #f43f5e;
  --green: #22c55e;
  --bg: #05070f;
  --bg-2: #0a0d1f;
  --bg-card: #0f1326;
  --bg-card2: #141a2f;
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --border: rgba(148, 163, 184, 0.12);
  --border-active: rgba(0, 240, 212, 0.45);
  --radius: 16px;
  --radius-lg: 24px;
  --sidebar: 260px;
  --font-d: 'Syne', sans-serif;
  --font-b: 'DM Sans', sans-serif;
  --shadow: 0 10px 30px rgba(0,0,0,0.6);
  --shadow-glow: 0 0 45px var(--cyan-glow);
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-b);
  font-size: 15px;
  line-height: 1.7;
  overflow-x: hidden;
  min-height: 100vh;
}

/* Background Enhancements */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(circle at 25% 25%, rgba(0,240,212,0.09) 0%, transparent 50%),
    radial-gradient(circle at 75% 75%, rgba(168,85,247,0.08) 0%, transparent 60%),
    url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
  animation: noise 10s steps(8) infinite;
}

.orb {
  position:fixed; border-radius:50%; filter:blur(130px); pointer-events:none; z-index:0; opacity:0.7;
  animation: floatOrb 28s ease-in-out infinite alternate;
}
.orb-1 { width:850px; height:850px; background:radial-gradient(circle, rgba(0,240,212,0.13), transparent 65%); top:-320px; left:-280px; }
.orb-2 { width:620px; height:620px; background:radial-gradient(circle, rgba(168,85,247,0.11), transparent 70%); bottom:-180px; right:-220px; animation-delay:-14s; }
.orb-3 { width:480px; height:480px; background:radial-gradient(circle, rgba(0,240,212,0.09), transparent 70%); top:45%; left:42%; animation-delay:-8s; }

@keyframes floatOrb {
  from { transform: translate(0, 0) rotate(0deg); }
  to { transform: translate(70px, 90px) rotate(10deg); }
}
@keyframes noise { 0% { opacity:0.04; } 100% { opacity:0.065; } }

/* Logo & Buttons */
.logo {
  font-family: var(--font-d); font-size: 1.6rem; font-weight: 800; color: var(--cyan);
  text-shadow: var(--shadow-glow); letter-spacing: -0.03em; text-decoration: none;
  display: flex; align-items: center; gap: 8px;
}
.logo span { color: #e0e7ff; }

.btn-primary {
  background: linear-gradient(90deg, var(--cyan), #67e8f9);
  color: #0a0f1c;
  border: none;
  padding: 13px 30px;
  border-radius: 14px;
  font-family: var(--font-b);
  font-weight: 700;
  font-size: 0.92rem;
  cursor: pointer;
  box-shadow: 0 0 30px var(--cyan-glow);
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}
.btn-primary::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
  transform: translateX(-150%);
  transition: 0.7s;
}
.btn-primary:hover::after { transform: translateX(300%); }
.btn-primary:hover {
  transform: translateY(-4px) scale(1.04);
  box-shadow: 0 0 50px var(--cyan-glow);
}

.btn-ghost {
  background: transparent;
  color: var(--text-muted);
  border: 1px solid var(--border);
  padding: 12px 26px;
  border-radius: 14px;
  font-weight: 600;
  transition: all 0.3s;
}
.btn-ghost:hover {
  border-color: var(--cyan);
  color: var(--cyan);
  background: var(--cyan-dim);
}

/* Cards & Hover Effects */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(0,240,212,0.04), transparent);
  opacity: 0;
  transition: opacity 0.4s;
}
.card:hover {
  transform: translateY(-10px);
  border-color: var(--cyan);
  box-shadow: var(--shadow-glow);
}
.card:hover::before { opacity: 1; }

/* Hero */
.hero-section {
  text-align: center;
  padding: 170px 24px 110px;
  position: relative;
  z-index: 2;
}
.hero-h1 {
  font-family: var(--font-d);
  font-size: clamp(3.2rem, 8.5vw, 6.2rem);
  font-weight: 800;
  line-height: 1.02;
  letter-spacing: -0.045em;
  margin-bottom: 28px;
}
.hero-h1 .accent {
  background: linear-gradient(90deg, var(--cyan), #c026d3);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Sidebar */
.sidebar {
  background: linear-gradient(to bottom, #0a0f1f, var(--bg-card));
  border-right: 1px solid var(--border);
}
.nav-item {
  border-radius: 12px;
  margin: 4px 10px;
  transition: all 0.25s ease;
}
.nav-item:hover, .nav-item.active {
  background: var(--cyan-dim);
  color: var(--cyan);
  transform: translateX(8px);
}

/* Upload Dropzone */
.drop-zone {
  border: 2px dashed var(--border);
  background: rgba(15, 23, 42, 0.6);
  transition: all 0.3s;
}
.drop-zone:hover, .drop-zone.drag-over {
  border-color: var(--cyan);
  background: var(--cyan-dim);
  transform: scale(1.02);
}

/* Chat Messages */
.msg {
  display: flex;
  gap: 14px;
  margin-bottom: 20px;
  animation: fadeIn 0.4s ease forwards;
}
.msg-bubble {
  max-width: 78%;
  padding: 15px 20px;
  border-radius: 20px;
  background: var(--bg-card2);
}
.msg.ai .msg-bubble {
  background: linear-gradient(135deg, #1e2937, var(--bg-card));
  border: 1px solid rgba(0,240,212,0.25);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(25px); }
  to { opacity: 1; transform: translateY(0); }
}

/* General Polish */
.section-head { font-family: var(--font-d); font-weight: 800; letter-spacing: -0.03em; }
.form-input, .search-bar input {
  background: var(--bg-card2);
  border: 1px solid var(--border);
  border-radius: 12px;
}
.form-input:focus, .search-bar:hover {
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px rgba(0,240,212,0.15);
}
</style>
</head>
<body>

<!-- APP -->
<div class="page" id="page-app">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sb-logo">
      <div class="sb-logo-icon">R</div>
      <a href="#" class="logo" onclick="showPage('landing')">Revynce</a>
    </div>
    
    <!-- Navigation items (you can expand this) -->
    <div class="sb-section">CORE</div>
    <button class="nav-item active" onclick="showPanel('dashboard', this)"><i class="fi fi-br-home"></i><span>Dashboard</span></button>

    <button class="nav-item" onclick="showPanel('chatbot', this)"><i class="fi fi-br-robot"></i><span>AI Tutor</span></button>
    
    <!-- Add more nav items as per your original code -->
  </div>

  <div class="app-main">
    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">Dashboard</div>

      <div class="topbar-right">

    </div>

    <!-- Main Content Area -->
    <div class="app-panel active" id="panel-dashboard">
      <div class="welcome-banner card">
        <div>
          <h2>Welcome back, Lakshan 👋</h2>
          <p>Ready to crush your studies today?</p>
        </div>
        <button class="btn-primary" onclick="showPanel('upload')">Upload New Material</button>
      </div>
      <!-- Add more panels as needed -->
    </div>

    <!-- Upload Panel (Example) -->
    <div class="app-panel" id="panel-upload">
      <h1 class="section-head">AI Upload</h1>
      <div class="drop-zone" id="appDrop">
        <i class="fi fi-br-cloud-upload" style="font-size:3rem;"></i>
        <p><strong>Drop your notes, PDF, or textbook here</strong></p>
        <p>or click to browse</p>
      </div>
      <button class="btn-primary" id="appGenBtn" onclick="appGenerate()">Generate AI Content</button>
    </div>

    <!-- Chatbot Panel -->
    <div class="app-panel" id="panel-chatbot">
      <h1 class="section-head">AI Tutor</h1>
      <div class="chatbox" style="background:var(--bg-card); border-radius:20px; padding:20px; height:70vh; display:flex; flex-direction:column;">
        <div id="chatMessages" style="flex:1; overflow-y:auto; padding:10px;"></div>
        <div style="display:flex; gap:10px; margin-top:15px;">
          <input type="text" id="chatInput" placeholder="Ask anything..." style="flex:1; padding:14px; border-radius:12px; background:var(--bg-card2); border:1px solid var(--border); color:white;">
          <button class="btn-primary" id="sendBtn" onclick="sendMsg()">Send</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ==================== YOUR ORIGINAL JAVASCRIPT ====================
// (All your existing functions are preserved)

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
}

function showPanel(name) {
  document.querySelectorAll('.app-panel').forEach(p => p.classList.remove('active'));
  const panel = document.getElementById('panel-' + name);
  if (panel) panel.classList.add('active');
}

// Upload functionality
let appUploadedFile = null;
const appDrop = document.getElementById('appDrop');

if (appDrop) {
  appDrop.addEventListener('click', () => document.createElement('input').click()); // placeholder
  appDrop.addEventListener('dragover', e => { e.preventDefault(); appDrop.classList.add('drag-over'); });
  appDrop.addEventListener('dragleave', () => appDrop.classList.remove('drag-over'));
  appDrop.addEventListener('drop', e => {
    e.preventDefault();
    appDrop.classList.remove('drag-over');
    // Handle file here
    console.log('File dropped!');
  });
}

// Chat functionality (simplified)
window.sendMsg = function() {
  const input = document.getElementById('chatInput');
  const messages = document.getElementById('chatMessages');
  if (!input.value.trim()) return;

  messages.innerHTML += `<div class="msg"><div class="msg-bubble" style="margin-left:auto; background:#1e2937;">${input.value}</div></div>`;
  messages.scrollTop = messages.scrollHeight;
  
  setTimeout(() => {
    messages.innerHTML += `<div class="msg ai"><div class="msg-bubble">Got it! How else can I help you today?</div></div>`;
    messages.scrollTop = messages.scrollHeight;
  }, 800);

  input.value = '';
};

// Initialize
console.log("%cRevynce Enhanced ✨ Ready", "color:#00f0d4; font-size:1.3rem; font-weight:700;");
</script>

</body>
